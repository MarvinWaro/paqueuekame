<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="NEXA runs open play for your pickleball club: fair rotation, live courts, and everyone's place in line on their phone." />
    <!-- Link previews in Messenger, Viber, WhatsApp and Facebook. Image paths must be full URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXA" />
    <meta property="og:title" content="NEXA: open play for pickleball clubs" />
    <meta property="og:description" content="A fair queue for your pickleball club. Live courts and everyone's place in line, on every phone. Free." />
    <meta property="og:url" content="https://nexa.nexus/" />
    <meta property="og:image" content="https://nexa.nexus/assets/img/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NEXA: Up Next and a pickleball court on a phone screen" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/assets/img/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500..700&display=swap" />
    <script>
      // Set the theme before the first paint so the page never flashes the wrong colors.
      (function () {
        var t = null;
        try { t = localStorage.getItem("pq:theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>NEXA</title>
    <style>
      /* Boot splash: inline so it shows before the app downloads. It stays invisible for the first
         300 ms, so on a fast connection nobody sees it; on a slow one the N builds once, then the bar
         breathes until the app is ready. main.tsx calls window.__nexaReady() after the first render. */
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #fafafa; color: #09090b; opacity: 0; animation: boot-in .2s .3s ease-out both; transition: opacity .25s ease-out; }
      html[data-theme="dark"] #boot { background: #09090b; color: #fafafa; }
      .boot-mark { display: grid; justify-items: center; gap: 22px; }
      .boot-n { width: 76px; height: auto; overflow: visible; animation: boot-lock .3s 1.35s ease-out both; }
      .boot-tri { fill: #ff6b2c; transform-origin: 118px 0; animation: boot-tri .35s .3s cubic-bezier(.2,.7,.2,1) both; }
      .boot-stem { fill: currentColor; transform-origin: 0 112px; animation: boot-stem .35s .55s cubic-bezier(.3,.7,.2,1) both; }
      .boot-diag { fill: currentColor; animation: boot-diag .45s .85s cubic-bezier(.4,0,.2,1) both; }
      .boot-bar { width: 44px; height: 3px; border-radius: 3px; background: #ff6b2c; transform-origin: center; animation: boot-bar .5s .3s ease-out both, boot-hold 1.2s 1.7s ease-in-out infinite; }
      .boot-slow { max-width: 260px; margin: 0; text-align: center; font: 14px/1.5 system-ui, sans-serif; opacity: .7; }
      .boot-slow button { font: inherit; font-weight: 600; color: inherit; background: none; border: 0; padding: 12px 4px; text-decoration: underline; cursor: pointer; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-tri { from { opacity: 0; transform: translate(6px, -6px) scale(.9); } to { opacity: 1; transform: none; } }
      @keyframes boot-stem { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes boot-diag { from { clip-path: polygon(0 0, 0 0, 0 0); } to { clip-path: polygon(0 0, 200% 0, 0 200%); } }
      @keyframes boot-lock { 50% { transform: scale(1.05); } }
      @keyframes boot-bar { from { opacity: 0; transform: scaleX(.2); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes boot-hold { 50% { opacity: .35; transform: scaleX(.6); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-n, .boot-tri, .boot-stem, .boot-diag, .boot-bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading NEXA">
      <div class="boot-mark">
        <svg class="boot-n" viewBox="0 0 118 112" aria-hidden="true">
          <path class="boot-tri" d="M62 0H110Q118 0 118 8V56Z" />
          <path class="boot-diag" d="M20 0H28L118 90V104Q118 112 110 112H94L28 46H20Z" />
          <path class="boot-stem" d="M0 12Q0 0 12 0H28V112H12Q0 112 0 100Z" />
        </svg>
        <div class="boot-bar"></div>
        <p class="boot-slow" hidden>Still loading. The connection may be slow. <button type="button" onclick="location.reload()">Reload</button></p>
      </div>
    </div>
    <script>
      // Hide the splash once the app has rendered: skip it if it never became visible, otherwise
      // fast-forward the build so it ends on the full logo, then fade out.
      window.__nexaReady = function () {
        window.__nexaReady = undefined;
        var el = document.getElementById("boot");
        if (!el) return;
        if (parseFloat(getComputedStyle(el).opacity) < 0.05) { el.remove(); return; }
        var anims = el.getAnimations ? el.getAnimations({ subtree: true }) : [];
        var once = anims.filter(function (a) { return a.effect && a.effect.getTiming().iterations !== Infinity; });
        anims.forEach(function (a) { if (once.indexOf(a) < 0) a.cancel(); });
        once.forEach(function (a) { a.playbackRate = 6; });
        var fade = function () {
          el.style.animation = "none"; el.style.opacity = "1"; void el.offsetWidth; el.style.opacity = "0";
          setTimeout(function () { el.remove(); }, 300);
        };
        var cap = setTimeout(fade, 400);
        Promise.all(once.map(function (a) { return a.finished; })).then(function () { clearTimeout(cap); fade(); }, fade);
      };
      // Still here after 12 s (a very slow connection, or the app failed to load): offer a reload.
      setTimeout(function () {
        var slow = window.__nexaReady && document.querySelector(".boot-slow");
        if (slow) slow.hidden = false;
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
